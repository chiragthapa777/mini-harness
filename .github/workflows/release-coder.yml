# Builds the mini-coder CLI and attaches it to a GitHub release.
#
# Trigger: pushing a tag like `coder-v0.3.0`. The CLI and the server are
# separate products with their own versions: plain `v*` tags release the server
# images (`release-images.yml`) and do not start this, and the other way round.
#
# The CLI is one JavaScript file that runs on Node 22+, so there is one build,
# not one per platform. `releases/latest/download/mini-coder.mjs` then always
# points at the newest one; docs/coder.md has the install and update commands.
name: Release mini-coder

on:
  push:
    tags:
      - "coder-v*"

# Creating a release and uploading to it needs contents write; nothing else does.
permissions:
  contents: write

# The version is the tag without its `coder-` prefix: `coder-v0.3.0` -> `v0.3.0`.
env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Takes the pnpm version from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A release that fails its own tests should not be downloadable.
      - name: Typecheck and test
        run: |
          pnpm --filter @mini-agent/coder --filter @mini-agent/coder-core --filter @mini-agent/coder-tools --filter @mini-agent/ink-markdown typecheck
          pnpm --filter @mini-agent/coder --filter @mini-agent/coder-core --filter @mini-agent/coder-tools --filter @mini-agent/ink-markdown test

      # The version is what `mini-coder --version` prints.
      - name: Build
        run: MINI_CODER_VERSION="${TAG#coder-}" pnpm --filter @mini-agent/coder build

      - name: Check the bundle runs
        run: test "$(node apps/coder/dist/mini-coder.mjs --version)" = "mini-coder ${TAG#coder-}"

      - name: Checksum
        working-directory: apps/coder/dist
        run: sha256sum mini-coder.mjs > mini-coder.mjs.sha256

      # Pre-release versions (coder-v1.4.0-rc.1) are marked as such, so they never
      # become "latest". `--clobber` lets a re-run of the same tag replace the files.
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#coder-}"
          case "$VERSION" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "mini-coder $VERSION" --generate-notes $PRERELEASE
          gh release upload "$TAG" apps/coder/dist/mini-coder.mjs apps/coder/dist/mini-coder.mjs.sha256 --clobber
