# Builds and publishes the three deployable images to GHCR on every version tag.
#
# Trigger: pushing a tag like `v1.4.0`. Nothing runs on branch pushes — the tag
# *is* the release signal, so `git tag v1.4.0 && git push origin v1.4.0` is the
# whole publish flow.
#
# Each app builds from the repo root (the Dockerfiles COPY workspace manifests,
# so the build context has to be the monorepo root, not the app directory).
name: Release images

on:
  push:
    tags:
      - "v*"

# GITHUB_TOKEN needs package write to push to ghcr.io; everything else stays read-only.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # One app failing shouldn't strand the other two half-published.
      fail-fast: false
      matrix:
        app: [api, worker, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.4.0 -> tags `1.4.0`, `1.4`, `1`, and `latest`. Pre-release tags
      # (v1.4.0-rc.1) get the full version only, and never move `latest`.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. arm64 would need QEMU emulation for `pnpm install`,
          # which roughly triples the build; add `linux/arm64` here if you
          # actually need to pull these on an Apple Silicon or Graviton host.
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
