# Builds and publishes the three deployable images to GHCR on every version tag.
#
# Trigger: pushing a tag like `v1.4.0`. Nothing runs on branch pushes — the tag
# *is* the release signal, so `git tag v1.4.0 && git push origin v1.4.0` is the
# whole publish flow.
#
# Each app builds from the repo root (the Dockerfiles COPY workspace manifests,
# so the build context has to be the monorepo root, not the app directory).
#
# Images are multi-arch: amd64 for the usual cloud host, arm64 for Apple
# Silicon and Graviton. Each architecture builds on its own native runner and
# the two are stitched into one manifest afterwards, rather than building arm64
# under QEMU — `pnpm install` emulated is roughly three times the wall clock,
# and this repo has free arm runners available to it.
name: Release images

on:
  push:
    tags:
      - "v*"

# GITHUB_TOKEN needs package write to push to ghcr.io; everything else stays read-only.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Stage one: build each app for each architecture and push it by digest,
  # untagged. Tags cannot be applied here — two runners pushing the same tag
  # would race, and the loser's architecture would vanish from the manifest.
  build:
    strategy:
      # One app failing shouldn't strand the other two half-published.
      fail-fast: false
      matrix:
        app: [api, worker, web]
        platform: [linux/amd64, linux/arm64]
        # These extend each matching combination with where to run it; the
        # cross product above is what produces the six jobs.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          # Cache per app *and* per architecture: an amd64 layer is useless to
          # an arm64 build, and sharing one scope means they evict each other.
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Stage two: one manifest per app, pointing at both digests, carrying the
  # tags. This is what makes `docker pull` resolve to the right architecture.
  merge:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.app }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.4.0 -> tags `1.4.0`, `1.4`, `1`, and `latest`. Pre-release tags
      # (v1.4.0-rc.1) get the full version only, and never move `latest`.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}@sha256:%s ' *)

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:${{ steps.meta.outputs.version }}
