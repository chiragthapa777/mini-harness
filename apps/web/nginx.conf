server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the vite dev proxy: strip /api, forward to the API service,
    # keep streaming responses (chat/stream) unbuffered.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
