services:
  postgres:
    # pgvector image, so the SQL store and the vector store are one database
    image: pgvector/pgvector:pg17
    container_name: mini-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mini_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # applied only on first boot of an empty volume
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mini_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mini-agent-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network, Postgres is reachable as `postgres:5432`
      # — the host-mapped POSTGRES_PORT above is only for tools on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mini_agent}
      PORT: ${API_PORT:-3001}
    ports:
      - "${API_HOST_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy

  # Background work: embeddings, summaries, consolidation, scheduled runs.
  # Same packages as the API, different entrypoint — scale it separately, or
  # drop it entirely and set JOBS_ENABLED=false to keep everything inline.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: mini-agent-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mini_agent}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mini-agent-web
    restart: unless-stopped
    environment:
      # nginx renders these into its proxy_pass at start; they have to agree
      # with the API's PORT above.
      API_HOST: ${API_HOST:-api}
      API_PORT: ${API_PORT:-3001}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres-data:
