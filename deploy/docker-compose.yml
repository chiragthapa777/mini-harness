# mini-agent — deployment compose.
#
# Runs the published images from GHCR; nothing is built here, so this file plus
# a `.env` beside it is the whole deployment. The repo is not needed on the host.
#
#   docker compose up -d
#
# That one command is also the upgrade. Every app service pulls on start
# (`pull_policy: always`), and VERSION defaults to `latest`, which the release
# workflow moves to each new non-prerelease tag — so a deploy never involves
# editing this file or bumping a number by hand. Set VERSION to an exact
# release (VERSION=0.1.0) when you want the opposite: deploys that only change
# when you say so.
#
# The root `docker-compose.yml` is the development one — it builds from source
# and exposes Postgres to the host. This is the one to copy onto a server.
#
# Ports: the web UI on WEB_PORT (8080), the API on API_HOST_PORT (3001). The
# UI does not use the published API port — it calls relative /api paths, which
# nginx forwards over the compose network — so publishing the API is only for
# reaching it directly, and commenting out its `ports:` costs the UI nothing.
# That is the shape to prefer inside a VPC: one public listener, with a TLS
# terminator (Caddy, nginx, an ALB) in front of `web`.
#
# Postgres is never published.

name: mini-agent

services:
  postgres:
    # pgvector, because the SQL store and the vector store are one database.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mini_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mini_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies packages/db/schema.sql (baked into the API image) and
  # exits. The schema is idempotent, so this runs on every deploy — a fresh
  # database and one several versions old both end up in the same place, and
  # nothing else starts until it has succeeded.
  db-init:
    image: ${REGISTRY:-ghcr.io/chiragthapa777/mini-harness}/api:${VERSION:-latest}
    # Without this, a floating tag like `latest` resolves to whatever was
    # pulled the first time and `up -d` silently keeps running the old image.
    pull_policy: always
    restart: "no"
    command: ["pnpm", "migrate"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_agent}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${REGISTRY:-ghcr.io/chiragthapa777/mini-harness}/api:${VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_agent}
      PORT: ${API_PORT:-3001}
    # Published so the API can be reached directly. The UI does not go through
    # this — drop these two lines and the app still works.
    ports:
      - "${API_HOST_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      # The same variable the API listens on, so moving the port cannot leave
      # the health check probing the old one.
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-3001}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Everything that happens outside a request: embeddings, conversation
  # summaries, consolidation, fact merging, and scheduled runs. Drop this
  # service and set JOBS_ENABLED=false to run everything inline instead.
  worker:
    image: ${REGISTRY:-ghcr.io/chiragthapa777/mini-harness}/worker:${VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_agent}
      # Exactly one worker may run the scheduler. Scaling the worker means
      # setting SCHEDULER_ENABLED=false on every replica but one — the overlap
      # guard and the dedupe key make a double-fire harmless, but there is no
      # reason to pay for it.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # nginx serving the built SPA. The frontend holds no API URL at all — it
  # calls relative /api paths and nginx forwards them to the api service over
  # the compose network, so the same image works on localhost, in a VPC, and
  # behind any domain.
  web:
    image: ${REGISTRY:-ghcr.io/chiragthapa777/mini-harness}/web:${VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # Where nginx forwards /api. `api` is the service name on the compose
      # network, not a hostname anyone outside needs to resolve; the port has
      # to match the API's PORT above, which is why both read the same var.
      API_HOST: ${API_HOST:-api}
      API_PORT: ${API_PORT:-3001}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres-data:
